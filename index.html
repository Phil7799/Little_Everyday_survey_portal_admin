<style>
  :root{
    --blue:#0B65AB; --blue-dark:#084B7E; --green:#009D53; --red:#E42025;
    --ink:#101820; --ink-soft:#4A5A68; --paper:#F5F8FB; --line:#E1E9F0; --white:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  h1,h2,.display{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:600; margin:0;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px; background:var(--ink); color:#fff;
  }
  header .brand{display:flex; align-items:center; gap:10px;}
  header img{width:26px; height:26px;}
  header .brand span{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  header .sub{font-size:12.5px; color:#9BB6CC;}

  .wrap{max-width:1100px; margin:0 auto; padding:28px 24px 60px;}

  /* gate */
  .gate{
    max-width:380px; margin:80px auto; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:32px; text-align:center;
  }
  .gate input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; margin:16px 0; font-family:inherit;
  }
  .gate button{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--blue);
    color:#fff; font-weight:600; font-size:15px; cursor:pointer;
  }
  .gate .err{color:var(--red); font-size:13px; min-height:18px; margin-top:8px;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .stat .num{font-family:'Space Grotesk'; font-size:26px; font-weight:700;}
  .stat .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
  .toolbar input[type=text]{
    padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; min-width:220px; font-family:inherit;
  }
  .btn{
    border:none; border-radius:9px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{background:#fff; border:1.5px solid var(--line); color:var(--ink);}

  table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  thead th{
    text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);
    background:#F0F4F8; padding:12px 14px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:12px 14px; font-size:14px; border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFCFE;}
  .status-pill{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;
    background:rgba(0,157,83,.12); color:var(--green);
  }
  .empty{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .loading{padding:60px 20px; text-align:center; color:var(--ink-soft);}
</style>
</head>

  <div class="sub" id="lastUpdated"></div>
</header>

<div id="gate" class="gate">
  <h2>Enter admin key</h2>
  <p style="color:var(--ink-soft); font-size:13.5px; margin-top:8px;">This matches the ADMIN_KEY set in your Apps Script project.</p>
  <input type="password" id="keyInput" placeholder="Admin key">
  <button id="unlockBtn">View submissions</button>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <div class="stat-row" id="statRow"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search by name, phone or ID...">
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" id="refreshBtn">Refresh</button>
      <button class="btn btn-primary" id="downloadBtn">Download CSV</button>
    </div>
  </div>

  <div id="tableHolder"><div class="loading">Loading submissions...</div></div>
</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
let ADMIN_KEY = '';
let rows = [];

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

async function unlock(){
  const key = document.getElementById('keyInput').value.trim();
  const errEl = document.getElementById('gateErr');
  errEl.textContent = '';
  if (!key) { errEl.textContent = 'Enter the admin key.'; return; }
  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_') === 0){
    errEl.textContent = 'Admin dashboard is not connected yet. Set SCRIPT_URL in this file.';
    return;
  }
  try{
    const res = await fetch(`${SCRIPT_URL}?action=admin&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok){ errEl.textContent = 'Incorrect key.'; return; }
    ADMIN_KEY = key;
    rows = data.rows || [];
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderStats(data.availability || []);
    renderTable(rows);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }catch(err){
    errEl.textContent = 'Could not reach the survey backend.';
  }
}

function renderStats(availability){
  const today = new Date().toISOString().slice(0,10);
  const todaySlot = availability.find(a => a.date === today) || { booked: 0, capacity: 50, remaining: 50 };
  const totalBookings = rows.length;
  const fullDays = availability.filter(a => a.full).length;

  document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="num">${totalBookings}</div><div class="lbl">Total survey responses</div></div>
    <div class="stat"><div class="num">${todaySlot.booked}/${todaySlot.capacity}</div><div class="lbl">Today's inspections booked</div></div>
    <div class="stat"><div class="num">${todaySlot.remaining}</div><div class="lbl">Slots left today</div></div>
    <div class="stat"><div class="num">${fullDays}</div><div class="lbl">Fully booked days ahead</div></div>
  `;
}

function renderTable(list){
  const holder = document.getElementById('tableHolder');
  if (!list.length){
    holder.innerHTML = '<div class="empty">No submissions yet.</div>';
    return;
  }
  const sorted = [...list].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  holder.innerHTML = `
    <table>
      <thead><tr>
        <th>Submitted</th><th>Name</th><th>Phone</th><th>ID number</th><th>Inspection date</th><th>Time</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${sorted.map(r => `
          <tr>
            <td>${new Date(r.timestamp).toLocaleString()}</td>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.phone)}</td>
            <td>${escapeHtml(r.idNumber)}</td>
            <td>${escapeHtml(r.date)}</td>
            <td>${escapeHtml(r.time)}</td>
            <td><span class="status-pill">${escapeHtml(r.status || 'Confirmed')}</span></td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderTable(rows.filter(r =>
    (r.name||'').toLowerCase().includes(q) ||
    (r.phone||'').toLowerCase().includes(q) ||
    (r.idNumber||'').toLowerCase().includes(q)
  ));
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  if (!ADMIN_KEY) return;
  const res = await fetch(`${SCRIPT_URL}?action=admin&key=${encodeURIComponent(ADMIN_KEY)}`);
  const data = await res.json();
  if (data.ok){
    rows = data.rows || [];
    renderStats(data.availability || []);
    renderTable(rows);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const header = ['Timestamp','Name','Phone','ID Number','Inspection Date','Time','Status'];
  const csvRows = [header.join(',')];
  rows.forEach(r => {
    const line = [r.timestamp, r.name, r.phone, r.idNumber, r.date, r.time, r.status]
      .map(v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`)
      .join(',');
    csvRows.push(line);
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `little-everyday-submissions-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
